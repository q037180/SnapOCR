name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag used in archive names (e.g. v1.0.1)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # action 版本：全部用 Node 24 运行时的 major，避免 GitHub 的
      # "Node.js 20 is deprecated ... forced to run on Node.js 24" 警告。
      # checkout v5+ / setup-python v6+ / upload-artifact v5+ / gh-release v3+
      # 都是 node24；这里取各自当前最新 major，用法未变。
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller py7zr

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" }
          if (-not $v) { $v = "v1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
          echo "Building version $v"

      # Both builds use the repo specs. The specs bundle app/assets and
      # RapidOCR data files, and filter stale top-level VC/ICU DLLs that
      # otherwise break Qt6Core on some hosts.
      - name: Build single-file exe
        run: pyinstaller SnapOCR.spec --noconfirm

      # Separate workpath so the two PyInstaller builds do not clobber
      # each other. Output: dist/SnapOCR/ (exe + _internal).
      - name: Build portable onedir
        run: pyinstaller SnapOCR-portable.spec --noconfirm --workpath build/portable --distpath dist

      - name: Pack portable 7z and write checksums
        env:
          SNAP_OCR_VERSION: ${{ steps.ver.outputs.version }}
        run: python tools/make_portable_7z.py

      - name: Verify artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $big = @(
            "dist/SnapOCR.exe",
            "dist/SnapOCR-$v-win64.7z"
          )
          $sums = @(
            "dist/SnapOCR.exe.sha256",
            "dist/SnapOCR-$v-win64.7z.sha256"
          )
          foreach ($p in $big) {
            if (-not (Test-Path $p)) { throw "Missing build output: $p" }
            $f = Get-Item $p
            if ($f.Length -lt 1MB) { throw "Suspiciously small: $p" }
            "{0}  {1} bytes" -f $p, $f.Length
          }
          foreach ($p in $sums) {
            if (-not (Test-Path $p)) { throw "Missing checksum: $p" }
            $line = (Get-Content $p -Raw).Trim()
            if ($line -notmatch '^[0-9a-f]{64}\s+\S+$') { throw "Bad checksum format: $p" }
            "{0}  {1}" -f $p, $line
          }

      - uses: actions/upload-artifact@v7
        with:
          name: SnapOCR-windows-x64
          path: |
            dist/SnapOCR.exe
            dist/*.7z
            dist/*.sha256

      # Release notes are maintained by hand; auto-generation would overwrite them.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/SnapOCR.exe
            dist/*.7z
            dist/*.sha256
          generate_release_notes: false
